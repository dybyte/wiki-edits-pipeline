name: wiki_edits
version: "0.1.0"
profile: wiki_edits   # profiles.yml에서 DB 접속 정보를 찾을 이름

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

models:
  wiki_edits:
    staging:
      +schema: staging          # ClickHouse의 staging 데이터베이스에 만든다
      +materialized: view       # 저장하지 않고, 조회할 때마다 계산
    marts:
      +schema: marts            # ClickHouse의 marts 데이터베이스에 만든다
      +materialized: table      # 실행할 때마다 통째로 다시 만든다
