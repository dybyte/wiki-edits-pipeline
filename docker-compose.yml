# 로컬 실행 환경: DW(ClickHouse) + 메시지 큐(Kafka, KRaft 단일 브로커)
#                  + 변환 스케줄러(Airflow) + 모니터링(kafka-exporter, Prometheus, Grafana)
services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_USER: wiki
      CLICKHOUSE_PASSWORD: wiki   # 로컬 전용 값
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      TZ: UTC
    ports:
      - "127.0.0.1:8123:8123"   # HTTP (dbt, Python 클라이언트가 쓴다)
      - "127.0.0.1:9000:9000"   # 네이티브 프로토콜 (clickhouse-client)
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      # 처음 뜰 때 raw 데이터베이스와 테이블을 만든다
      - ./warehouse/init:/docker-entrypoint-initdb.d:ro
      - chdata:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user wiki --password wiki --query 'select 1'"]
      interval: 5s
      retries: 20

  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 리스너 두 개: PLAINTEXT는 맥에서 도는 프로듀서·컨슈머용, DOCKER는 같은 compose 네트워크 안의 컨테이너(kafka-exporter)용.
      # 클라이언트는 처음 붙은 뒤 메타데이터로 받은 광고 주소로 다시 접속한다.
      # 컨테이너 안에서 localhost:9092는 자기 자신이라, 컨테이너에는 kafka:19092를 광고해야 한다.
      KAFKA_LISTENERS: PLAINTEXT://:9092,DOCKER://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      # 기본값(/tmp/kafka-logs)은 컨테이너 안이라, 설정을 바꿔 컨테이너가 다시 만들어지면 토픽과 오프셋이 사라진다
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 5s
      retries: 20

  # Kafka에 관리자 API로 물어봐서(토픽별 끝 오프셋, 그룹별 커밋 오프셋) Prometheus 형식으로 내놓는다.
  # lag = 파티션 끝 오프셋 - 그룹이 커밋한 오프셋. 컨슈머가 꺼져 있어도 커밋 기록이 남아 있으면 계산된다.
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    command:
      - --kafka.server=kafka:19092
      # Kafka 4.0부터 오래된 프로토콜 버전을 받지 않는다. 기본값(2.0.0)보다 높게 잡아 새 버전으로 요청하게 한다
      - --kafka.version=3.9.0
    ports:
      - "127.0.0.1:9308:9308"   # http://localhost:9308/metrics 에서 원본 지표를 볼 수 있다
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure   # 시작할 때 Kafka에 못 붙으면 종료하므로 다시 띄운다

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus   # 수집한 시계열. 컨테이너를 다시 만들어도 실험 그래프가 남는다

  grafana:
    image: grafana/grafana:12.2.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # 로컬 전용: 로그인 없이 편집 권한으로 들어간다
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/kafka-exporter-overview.json
    volumes:
      # 데이터 소스와 대시보드를 파일로 등록한다. 화면에서 고친 내용은 컨테이너를 다시 만들면 사라지므로, 남기려면 JSON으로 내보내 이 폴더에 저장한다
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # 학습·로컬 개발용 all-in-one Airflow. SQLite와 단일 프로세스 구성이므로 운영용은 아니다.
  # http://localhost:8080, 최초 admin 비밀번호는 `docker compose logs airflow`에서 확인한다.
  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    command: standalone
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: wiki
      CLICKHOUSE_PASSWORD: wiki
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./dbt:/opt/wiki-edits/dbt:ro
      - airflowdata:/opt/airflow
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  chdata:
  kafkadata:
  promdata:
  # Docker가 관리하는 영속 저장소다. 프로젝트 폴더가 아니므로 Git에는 포함되지 않는다.
  # Airflow의 SQLite DB, 로그, 로컬 관리자 비밀번호 파일이 들어간다.
  airflowdata:
